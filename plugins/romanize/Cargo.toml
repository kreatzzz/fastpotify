[package]
name = "woofer-plugin-romanize"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "The Romanize plugin for Woofer: Latin-letter spellings for lines one cannot sing from"
repository = "https://github.com/kreatzzz/woofer-plugin-romanize"
keywords = ["woofer", "plugin", "romanize", "spotify"]
categories = ["multimedia::audio"]

[lib]
crate-type = ["cdylib"]

[dependencies]
woofer-plugin-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[dev-dependencies]
woofer-plugin-sdk = { path = "../sdk", features = ["harness"] }
# The tests read the query back out of the planned URLs.
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
