# legacy Jekyll settings retained until the Pages workflow switches to
# VitePress; the canonical site configuration lives in .vitepress/config.mjs.
title: Woofer
woofer_version: "0.4.0"
description: A fast, native Spotify client for Linux, macOS, and Windows.
lang: en-US
timezone: Europe/Berlin
url: https://usewoofer.com
baseurl: ""
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - Spotify client
        - Rust
        - egui
        - librespot
        - Spotify Connect
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: Woofer showing a playlist with the queue open and a track playing
    publisher:
      type: Person
      name: Carmine Paolino
      url: https://kreatzzz.me
      same_as:
        - https://github.com/kreatzzz/woofer
  llms:
    title: Woofer
    description: >-
      Documentation for Woofer, a fast native Spotify client written in
      Rust with egui and librespot: one lightweight app for your whole
      library, local playback, and Spotify Connect on Linux, macOS, and
      Windows.
    full: true
    details: >-
      The canonical documentation covers installation, signing in, everyday
      use, settings, and how the client connects to Spotify. Source is on
      [GitHub](https://github.com/kreatzzz/woofer).
  branding:
    site_title: Woofer
    logo:
      default: /assets/images/logo.svg
      alt: Woofer
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Woofer is independent software, built for people who keep music close.
    copyright: >-
      MIT-licensed. Woofer is independent software, not affiliated with or endorsed by Spotify AB.
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/kreatzzz/woofer/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: kreatzzz/woofer
    text: Star
    show_count: true

plugins:
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
